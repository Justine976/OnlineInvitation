<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create and share beautiful RSVP invitations — no account needed.">
  <title>RSVP — Create an Invitation</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="theme-blush">
  <div class="romance-layer" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <main class="page-shell builder-shell">
    <section class="panel form-panel" aria-labelledby="builderTitle">
      <p class="eyebrow">Builder</p>
      <h1 id="builderTitle">Plan something worth saying yes to</h1>
      <p class="lede">A warm invite for a date, a coffee, or a good excuse to spend time together.</p>

      <form id="inviteForm" class="stack">
        <div class="field">
          <label for="inviterEmail">Your email</label>
          <input type="email" id="inviterEmail" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="inviteeName">Who to invite</label>
          <input type="text" id="inviteeName" maxlength="80" placeholder="Their name" required>
        </div>

        <div class="field">
          <label for="title">Invite title</label>
          <input type="text" id="title" maxlength="80" value="Coffee and a little adventure" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="type">Type of date</label>
            <select id="type" required>
              <optgroup label="💕 Romantic Dates">
                <option value="coffee-date">Coffee & Conversation</option>
                <option value="dinner-date">Candlelit Dinner</option>
                <option value="sunset-drinks">Sunset Drinks</option>
                <option value="stargazing">Stargazing & Dessert</option>
                <option value="wine-tasting">Wine Tasting</option>
                <option value="cooking-together">Cooking Together</option>
              </optgroup>
              <optgroup label="🎨 Creative & Fun">
                <option value="museum-date">Museum & Gallery</option>
                <option value="art-class">Paint & Sip Class</option>
                <option value="pottery-date">Pottery Workshop</option>
                <option value="comedy-show">Comedy Club</option>
                <option value="live-music">Live Music / Jazz</option>
                <option value="dance-class">Dance Lesson</option>
              </optgroup>
              <optgroup label="🌿 Outdoor & Adventure">
                <option value="picnic-date">Park Picnic</option>
                <option value="hiking-date">Scenic Hike</option>
                <option value="beach-walk">Beach Sunset Walk</option>
                <option value="botanical-garden">Botanical Garden</option>
                <option value="bike-ride">Bike Ride & Brunch</option>
                <option value="kayaking">Kayaking / Paddleboard</option>
              </optgroup>
              <optgroup label="☕ Casual & Cozy">
                <option value="brunch-date">Weekend Brunch</option>
                <option value="bookstore-date">Bookstore Browse</option>
                <option value="farmers-market">Farmers Market</option>
                <option value="ice-cream">Ice Cream Stroll</option>
                <option value="board-games">Board Game Cafe</option>
                <option value="movie-night">Movie & Dinner</option>
              </optgroup>
              <optgroup label="🤝 Friendly Hangout">
                <option value="hangout">Friendly Hangout</option>
              </optgroup>
            </select>
          </div>

          <div class="field">
            <label for="theme">Theme</label>
            <select id="theme" required>
              <option value="blush">Blush</option>
              <option value="sunrise">Sunrise</option>
              <option value="garden">Garden</option>
              <option value="midnight">Midnight</option>
              <option value="flirt">Flirt</option>
            </select>
          </div>
        </div>

        <div class="field-row field-row-3">
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>

          <div class="field">
            <label for="timeStart">Start time</label>
            <input type="time" id="timeStart" required>
          </div>

          <div class="field">
            <label for="timeEnd">End time</label>
            <input type="time" id="timeEnd">
          </div>
        </div>

        <div class="field">
          <label for="place">Place</label>
          <input type="text" id="place" maxlength="120" placeholder="Cafe Luna" required>
        </div>

        <div class="field">
          <label for="message">Personal message</label>
          <textarea id="message" maxlength="240" placeholder="I picked this because it made me think of you." required></textarea>
        </div>

        <div class="field">
          <label for="todo">Itinerary</label>
          <textarea id="todo" maxlength="280" placeholder="Coffee first, then a walk somewhere pretty." required></textarea>
        </div>

        <div class="action-row">
          <button class="primary-action" type="submit" id="createButton">Create share link</button>
          <button class="secondary-button" type="button" id="savePlanButton">Save Plan</button>
        </div>
        <p class="status-message" id="createStatus" aria-live="polite"></p>
      </form>
    </section>

    <aside class="invite-card theme-card theme-blush preview-card" id="previewCard" aria-labelledby="previewHeading">
      <p class="eyebrow">Live Preview</p>
      <h2 id="previewHeading"></h2>
      <p class="preview-message" id="previewMessage"></p>

      <dl class="detail-list">
        <div>
          <dt>Type of Date</dt>
          <dd id="previewTypeDetail"></dd>
        </div>
        <div>
          <dt>Date</dt>
          <dd id="previewDate"></dd>
        </div>
        <div>
          <dt>Time</dt>
          <dd id="previewTime"></dd>
        </div>
        <div>
          <dt>To</dt>
          <dd id="previewInvitee"></dd>
        </div>
        <div>
          <dt>Place</dt>
          <dd id="previewPlace"></dd>
        </div>
        <div>
          <dt>Itinerary</dt>
          <dd id="previewTodo"></dd>
        </div>
      </dl>
    </aside>

    <section class="load-plan-panel" id="loadPlanPanel" aria-labelledby="loadPlanTitle">
      <p class="eyebrow">Saved Plans</p>
      <h2 id="loadPlanTitle">Pick up where you left off</h2>
      <p class="load-plan-lede">Load a previously saved plan or try one of our pre-built templates.</p>
      <select id="savedPlanSelect" size="4">
        <option value="" disabled>No saved plans</option>
      </select>
      <div class="action-row">
        <button class="secondary-button" type="button" id="loadPlanButton" disabled>Load selected plan</button>
        <button class="secondary-button danger" type="button" id="deletePlanButton" disabled>Discard selected</button>
      </div>
      <p class="status-message" id="loadPlanStatus" aria-live="polite"></p>
    </section>
  </main>

  <script src="assets/js/app.js?v=4"></script>
</body>
</html>
