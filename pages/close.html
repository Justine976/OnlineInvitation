<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="You can close this page.">
  <title>Done</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #fdf2f7, #eef7fb);
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
      padding: 40px 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(25, 30, 40, 0.12);
    }
    
    .icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }
    
    h1 {
      font-size: 1.5rem;
      color: #202124;
      margin-bottom: 12px;
    }
    
    p {
      color: #5f6368;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    
    .hint {
      font-size: 0.85rem;
      color: #999;
      font-style: italic;
    }
    
    @media (max-width: 480px) {
      .container {
        padding: 30px 24px;
      }
      
      h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">💌</div>
    <h1>All done!</h1>
    <p>You can close this page now.</p>
    <p class="hint">Tap the X or close button to exit.</p>
  </div>
  
  <script>
    // Try to close the window (works in some in-app browsers)
    setTimeout(function() {
      try {
        window.close();
      } catch (e) {
        // Ignore errors - user can close manually
      }
    }, 1000);
  </script>
</body>
</html>
